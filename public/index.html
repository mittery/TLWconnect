<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TLWconnect</title>
  <link rel="icon" type="image/png" href="/favicon-32x32.png">
  <meta name="description"
    content="TLWconnect พื้นที่สนทนานิรนามแบบเรียลไทม์ ปลอดภัย ไร้ตัวตน แชร์เรื่องราว ระบาย ส่งข้อเสนอแนะ และคำร้องได้อย่างอิสระ">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Prompt:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="particle-canvas-container"></div>

  <!-- ================= AUTH GATEWAY (LOGIN & REGISTER BEFORE ACCESS) ================= -->
  <div id="auth-gateway" class="auth-gateway-overlay">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-crest-wrap">
          <span class="auth-crest-icon">🏫</span>
        </div>
        <div class="auth-badge-pill">โรงเรียนท่าลี่วิทยา • สีเหลือง-แดง 🟡🔴</div>
        <h2 class="auth-title">TLW<span>connect</span></h2>
        <p class="auth-sub">กรุณาเข้าสู่ระบบ หรือ สร้างบัญชีนักเรียนก่อนเข้าใช้งานชุมชน</p>
      </div>

      <!-- Tab Switcher -->
      <div class="auth-tabs">
        <button type="button" id="tab-btn-login" class="auth-tab-btn active">
          <span class="tlw-icon" style="margin-right:6px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              style="width:16px;height:16px">
              <circle cx="7.5" cy="15.5" r="5.5" />
              <path d="m21 2-9.6 9.6" />
